name: CI

on:
  push:
    branches: [dev,main]
  pull_request:
    branches: [dev,main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore backend/Mehewara.API/Mehewara.API.csproj
          dotnet restore test/Mehewara.Tests.Member2/Mehewara.Tests.Member2.csproj

      - name: Build API and Tests
        run: |
          dotnet build backend/Mehewara.API/Mehewara.API.csproj --configuration Release --no-restore
          dotnet build test/Mehewara.Tests.Member2/Mehewara.Tests.Member2.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test test/Mehewara.Tests.Member2/Mehewara.Tests.Member2.csproj --configuration Release --no-build

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service/mehewara-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/mehewara-ai/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --frozen pytest

  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/mehewara-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/mehewara-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run web tests
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/mehewara_mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub
