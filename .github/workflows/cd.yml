name: CD - Deploy main to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to VPS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/harshajayaweera21/mehewara
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service images
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -f backend/Mehewara.API/Dockerfile -t "$IMAGE_PREFIX-backend:$IMAGE_TAG" -t "$IMAGE_PREFIX-backend:latest" .
          docker build -f ai-service/mehewara-ai/Dockerfile -t "$IMAGE_PREFIX-ai:$IMAGE_TAG" -t "$IMAGE_PREFIX-ai:latest" .
          docker build --build-arg VITE_API_BASE_URL=/api -f web/mehewara-web/Dockerfile -t "$IMAGE_PREFIX-frontend:$IMAGE_TAG" -t "$IMAGE_PREFIX-frontend:latest" .
          docker push "$IMAGE_PREFIX-backend:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-backend:latest"
          docker push "$IMAGE_PREFIX-ai:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-ai:latest"
          docker push "$IMAGE_PREFIX-frontend:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-frontend:latest"

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            mkdir -p "${{ secrets.VPS_DEPLOY_PATH }}/nginx"

      - name: Upload production configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker/compose.prod.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: Upload Nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker/nginx/default.conf"
          target: ${{ secrets.VPS_DEPLOY_PATH }}/nginx
          strip_components: 2

      - name: Deploy tested images to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            test -s .env || { echo "Missing production .env file"; exit 1; }
            docker info >/dev/null || { echo "Deployment user cannot access Docker"; exit 1; }
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose --env-file .env -f compose.prod.yml pull
            docker compose --env-file .env -f compose.prod.yml up -d
            docker compose --env-file .env -f compose.prod.yml ps
            curl --fail --retry 10 --retry-delay 3 http://localhost/health
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
