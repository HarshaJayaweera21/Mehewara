services:
  postgres-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mehewara

  ai-service:
    image: ${AI_IMAGE}
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      DOTNET_API_BASE_URL: http://backend:8080
      PORT: 8000
      ENVIRONMENT: production
      CORS_ORIGINS: http://backend:8080
    networks:
      - mehewara

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MehewaraAPI
      Jwt__Audience: MehewaraClient
      Jwt__ExpiryHours: 24
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      AiService__BaseUrl: http://ai-service:8000
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Https__Enabled: false
      Cors__AllowedOrigins__0: http://${VPS_IP}
    depends_on:
      postgres-db:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - mehewara

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - mehewara

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mehewara

volumes:
  postgres_data:

networks:
  mehewara:
